name: Pruebas móviles por dispositivo
on:
  workflow_dispatch:
    inputs:
      target:
        description: Suites incluidas en el reporte
        type: choice
        options: [all, mobile]
        default: all
      suite:
        description: Alcance de la ejecución
        type: choice
        options: [smoke, regression, catalog, exploratory]
        default: smoke
      seed:
        description: Semilla reproducible para productos exploratorios
        type: string
        default: assessment-2.3.0
      sample_size:
        description: Productos de la muestra exploratoria (1 a 24)
        type: number
        default: 3
permissions:
  contents: read
jobs:
  android:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [30, 33]
    env:
      TEST_TARGET: ${{ inputs.target }}
      MOBILE_DATA_SEED: ${{ inputs.seed }}
      MOBILE_SAMPLE_SIZE: ${{ inputs.sample_size }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
      MOBILE_SUITE: ${{ inputs.suite }}
      ANDROID_UDID: emulator-5554
      ANDROID_DEVICE_NAME: android-api-${{ matrix.api }}
      ANDROID_SYSTEM_PORT: '8200'
      APPIUM_PORT: '4723'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Comprobar TypeScript
        run: npm run typecheck
      - name: Descargar y verificar APK
        run: npm run app:download
      - name: Habilitar KVM en el runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar con emulador y servidor Appium
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          emulator-build: 16740729
          emulator-boot-timeout: 600
          script: npm run test:mobile:ci
      - name: Conservar reportes y logs incluso ante fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}-${{ inputs.suite }}
          path: |
            reports/combined/
            reports/mobile/
            artifacts/android-local/
          retention-days: 7
