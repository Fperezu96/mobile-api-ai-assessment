name: QA API y Android
run-name: API + Android ${{ inputs.suite || 'smoke' }} · ${{ github.ref_name }}

on:
  push:
    branches: [docs/separate-product-strategies-and-native-performance]
  workflow_dispatch:
    inputs:
      suite:
        description: Selección móvil
        type: choice
        default: smoke
        options: [smoke, regression, catalog, exploratory]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API · reservas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Instalar y comprobar TypeScript
        run: npm ci && npm run typecheck
      - name: Ejecutar los ocho escenarios API
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: npm run test:api
      - name: Resumir resultados API
        if: always()
        run: node scripts/quality/github-summary.mjs api
      - name: Conservar reporte API
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/api/
          if-no-files-found: warn
          retention-days: 3

  android:
    name: Android 13 · ${{ inputs.suite || 'smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_UDID: emulator-5554
      ANDROID_DEVICE_NAME: GitHub_API33
      MOBILE_SUITE: ${{ inputs.suite || 'smoke' }}
      MOBILE_DATA_SEED: github-${{ github.run_id }}
      MOBILE_SAMPLE_SIZE: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools emulator
          log-accepted-android-sdk-licenses: false
      - name: Instalar dependencias y APK verificada
        run: |
          npm ci
          npm run typecheck
          npm run app:download
          sdkmanager "build-tools;35.0.0"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Arrancar Android y ejecutar Appium
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: qa_ci
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            adb devices
            npm run appium:doctor
            npm run test:mobile:ci
      - name: Resumir resultados Android
        if: always()
        run: node scripts/quality/github-summary.mjs mobile
      - name: Conservar reporte y logs Android
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-android-api33-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/mobile/
            artifacts/android-local/
          if-no-files-found: warn
          retention-days: 3
